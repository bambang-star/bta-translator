<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Translator</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-900 text-white min-w-full min-h-screen flex flex-col items-center justify-start p-4 py-8">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">AI Universal Translator</h1>

        <!-- Pilihan Bahasa Asal & Tujuan -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Dari Bahasa:</label>
                <select id="sourceLang" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="id-ID">Indonesia</option>
                    <option value="en-US">English</option>
                    <option value="tr-TR">Türkçe</option>
                    <option value="ar-SA">العربية</option>
                    <option value="ja-JP">日本語</option>
                    <option value="ru-RU">Русский</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Ke Bahasa:</label>
                <select id="targetLang" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="tr">Türkçe (Turki)</option>
                    <option value="en">English (Inggris)</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="ar">العربية (Arab)</option>
                    <option value="ja">日本語 (Jepang)</option>
                    <option value="ru">Русский (Rusia)</option>
                </select>
            </div>
        </div>

        <!-- Input Teks & Tombol Rekam Suara -->
        <div class="mb-4">
            <div class="flex justify-between items-center mb-1">
                <label class="text-sm font-medium text-slate-300">Teks / Suara Masukan:</label>
                <button onclick="startVoiceRecognition()" id="micBtn" class="flex items-center gap-1 text-xs bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-full transition shadow">
                    🎙️ <span id="micText">Ucapkan Sesuatu</span>
                </button>
            </div>
            <textarea id="inputText" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Ketik atau gunakan mikrofon di atas..."></textarea>
        </div>

        <!-- Tombol Aksi Terjemah -->
        <button onclick="translateText()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg mb-4">
            Terjemahkan Sekarang
        </button>

        <!-- Hasil Terjemahan Utama -->
        <div class="mt-4 p-4 bg-slate-900 border border-slate-700 rounded-xl relative">
            <span class="block text-xs text-slate-400 mb-1">Hasil Terjemahan:</span>
            <p id="outputText" class="text-lg font-medium min-h-[40px] text-slate-100">-</p>
            
            <!-- Tombol Putar Suara AI Online -->
            <button onclick="playResultAudio()" class="mt-3 flex items-center justify-center gap-2 w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-indigo-300 py-2 rounded-lg transition text-sm font-medium">
                🔊 Putar Suara AI
            </button>
        </div>

        <!-- Bagian Riwayat Terjemahan (History) -->
        <div class="mt-8 border-t border-slate-700 pt-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-semibold text-slate-300 flex items-center gap-2">
                    📜 Riwayat Terjemahan
                </h2>
                <button onclick="clearHistory()" class="text-xs text-rose-400 hover:text-rose-300 transition">
                    Hapus Semua
                </button>
            </div>
            
            <div id="historyList" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <p class="text-xs text-slate-500 text-center py-2">Belum ada riwayat terjemahan.</p>
            </div>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        // Memuat riwayat saat aplikasi dibuka
        document.addEventListener("DOMContentLoaded", renderHistory);

        // 1. Fitur Rekam Suara (Speech-to-Text / Mikrofon)
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Maaf, browser atau perangkat Anda tidak mendukung fitur pengenalan suara.");
                return;
            }

            const recognition = new SpeechRecognition();
            const sourceLang = document.getElementById("sourceLang").value;
            recognition.lang = sourceLang;
            
            const micBtn = document.getElementById("micBtn");
            const micText = document.getElementById("micText");
            
            recognition.onstart = function() {
                micBtn.classList.remove("bg-rose-600", "hover:bg-rose-500");
                micBtn.classList.add("bg-amber-600", "animate-pulse");
                micText.innerText = "Mendengarkan...";
            };

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById("inputText").value = speechToText;
            };

            recognition.onerror = function(event) {
                console.error("Error Speech Recognition:", event.error);
                alert("Gagal mendeteksi suara. Silakan coba lagi.");
            };

            recognition.onend = function() {
                micBtn.classList.remove("bg-amber-600", "animate-pulse");
                micBtn.classList.add("bg-rose-600", "hover:bg-rose-500");
                micText.innerText = "Ucapkan Sesuatu";
            };

            recognition.start();
        }

        // 2. Pemutar Suara AI Full Online (Google Cloud TTS)
        // Perbaikan Fungsi Pemutar Suara AI Online yang Lebih Stabil
function speakText(text, langCode) {
    if (!text || text === "-") return;

    // Hentikan dan bersihkan audio sebelumnya jika ada
    if (window.currentAudio) {
        window.currentAudio.pause();
        window.currentAudio = null;
    }

    const shortLang = langCode ? langCode.split('-')[0] : 'en';
    const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${shortLang}&client=tw-ob`;

    // Buat elemen audio baru
    const audio = new Audio();
    audio.crossOrigin = "anonymous";
    audio.src = ttsUrl;
    
    window.currentAudio = audio;

    // Coba putar audio dengan penanganan promise yang aman
    audio.play().catch(error => {
        console.warn("Gagal memutar otomatis, mencoba metode alternatif...", error);
        
        // Fallback: Buka atau muat ulang via interaksi elemen jika diblokir policy
        setTimeout(() => {
            audio.play().catch(err => {
                console.error("Error fatal audio:", err);
                alert("Gagal memutar suara. Pastikan koneksi internet stabil.");
            });
        }, 200);
    });
}

        // 3. Fungsi Terjemahan Teks & Simpan Riwayat
        async function translateText() {
            const query = document.getElementById("inputText").value.trim();
            const sourceLangShort = document.getElementById("sourceLang").value.split('-')[0];
            const targetLang = document.getElementById("targetLang").value;
            const outputElement = document.getElementById("outputText");

            if (!query) {
                alert("Silakan masukkan teks atau ucapkan sesuatu terlebih dahulu!");
                return;
            }

            outputElement.innerText = "Menerjemahkan...";

            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(query)}&langpair=${sourceLangShort}|${targetLang}`);
                const data = await response.json();

                if (data && data.responseData) {
                    const translatedText = data.responseData.translatedText;
                    outputElement.innerText = translatedText;

                    // Simpan ke Riwayat
                    saveToHistory(query, translatedText, targetLang);
                } else {
                    outputElement.innerText = "Gagal mendapatkan terjemahan.";
                }
            } catch (err) {
                console.error(err);
                outputElement.innerText = "Terjadi kesalahan jaringan.";
            }
        }

        // 4. Panggil pemutar suara hasil terjemahan
        function playResultAudio() {
            const text = document.getElementById("outputText").innerText;
            const targetLang = document.getElementById("targetLang").value;
            speakText(text, targetLang);
        }

        // --- MANAJEMEN RIWAYAT TERJEMAHAN (LOCALSTORAGE) ---
        function saveToHistory(original, translated, targetLang) {
            let history = JSON.parse(localStorage.getItem("translator_history")) || [];
            
            // Tambahkan entri baru di posisi paling atas
            history.unshift({
                original: original,
                translated: translated,
                lang: targetLang,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            // Batasi riwayat maksimal 20 item agar hemat memori
            if (history.length > 20) {
                history.pop();
            }

            localStorage.setItem("translator_history", JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById("historyList");
            let history = JSON.parse(localStorage.getItem("translator_history")) || [];

            if (history.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">Belum ada riwayat terjemahan.</p>`;
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="bg-slate-900 border border-slate-700/60 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div class="flex-1 pr-2">
                        <div class="text-slate-400 text-[10px] mb-0.5">${item.time} • ${item.lang.toUpperCase()}</div>
                        <div class="font-medium text-slate-200">${item.original}</div>
                        <div class="text-indigo-400 font-semibold mt-0.5">${item.translated}</div>
                    </div>
                    <button onclick="speakText('${escapeHtml(item.translated)}', '${item.lang}')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg text-indigo-300 transition border border-slate-700" title="Putar Suara">
                        🔊
                    </button>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm("Apakah Anda yakin ingin menghapus seluruh riwayat terjemahan?")) {
                localStorage.removeItem("translator_history");
                renderHistory();
            }
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        // Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
