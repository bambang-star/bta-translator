<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Translator</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-900 text-white min-w-full min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">AI Universal Translator</h1>

        <!-- Input Teks -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-2">Teks yang ingin diterjemahkan:</label>
            <textarea id="inputText" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="Ketik sesuatu..."></textarea>
        </div>

        <!-- Pilihan Bahasa Target -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-2">Pilih Bahasa Tujuan:</label>
            <select id="targetLang" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                <option value="id">Bahasa Indonesia</option>
                <option value="en">English (Inggris)</option>
                <option value="tr">Türkçe (Turki)</option>
                <option value="ar">العربية (Arab)</option>
                <option value="ja">日本語 (Jepang)</option>
                <option value="ru">Русский (Rusia)</option>
            </select>
        </div>

        <!-- Tombol Aksi -->
        <button onclick="translateText()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg mb-4">
            Terjemahkan
        </button>

        <!-- Hasil Terjemahan -->
        <div class="mt-4 p-4 bg-slate-900 border border-slate-700 rounded-xl relative">
            <span class="block text-xs text-slate-400 mb-1">Hasil Terjemahan:</span>
            <p id="outputText" class="text-lg font-medium min-h-[40px] text-slate-100">-</p>
            
            <!-- Tombol Putar Suara AI -->
            <button onclick="playResultAudio()" class="mt-3 flex items-center justify-center gap-2 w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-indigo-300 py-2 rounded-lg transition text-sm font-medium">
                🔊 Putar Suara AI
            </button>
        </div>
    </div>

    <!-- Script Utama (Logika Terjemahan & Audio AI Full Online) -->
    <script>
        // Fungsi Utama Pemutar Suara AI Full Online (Mendukung Semua Bahasa)
        function speakText(text, langCode) {
            if (!text || text === "-") return;

            // Hentikan audio sebelumnya jika sedang berjalan
            if (window.currentAudio) {
                window.currentAudio.pause();
                window.currentAudio.currentTime = 0;
            }

            // Normalisasi kode bahasa (misal: 'tr-TR' atau 'tr' menjadi 'tr')
            const shortLang = langCode ? langCode.split('-')[0] : 'en';

            // Endpoint Google Cloud TTS AI Online yang jernih dan natural
            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${shortLang}&client=tw-ob`;

            window.currentAudio = new Audio(ttsUrl);
            window.currentAudio.play().catch(error => {
                console.error("Gagal memutar audio AI Online:", error);
                alert("Gagal memutar suara. Pastikan perangkat terhubung ke internet.");
            });
        }

        // Fungsi Simulasi Terjemahan menggunakan API Gratis MyMemory
        async function translateText() {
            const query = document.getElementById("inputText").value.trim();
            const targetLang = document.getElementById("targetLang").value;
            const outputElement = document.getElementById("outputText");

            if (!query) {
                alert("Silakan masukkan teks terlebih dahulu!");
                return;
            }

            outputElement.innerText = "Menerjemahkan...";

            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(query)}&langpair=auto|${targetLang}`);
                const data = await response.json();

                if (data && data.responseData) {
                    outputElement.innerText = data.responseData.translatedText;
                } else {
                    outputElement.innerText = "Gagal mendapatkan terjemahan.";
                }
            } catch (err) {
                console.error(err);
                outputElement.innerText = "Terjadi kesalahan jaringan.";
            }
        }

        // Panggil pemutar suara berdasarkan hasil teks dan bahasa yang dipilih
        function playResultAudio() {
            const text = document.getElementById("outputText").innerText;
            const targetLang = document.getElementById("targetLang").value;
            speakText(text, targetLang);
        }

        // Pendaftaran Service Worker untuk PWA Offline (Opsional tapi aman dipasang)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
