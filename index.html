<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Polyglot Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md text-center">
        <h1 class="text-xl font-bold text-cyan-400">AI Universal Translator</h1>
        <p class="text-xs text-slate-400">ID, EN, TR, AR, JA, RU • Manual Recording & Storage</p>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto w-full space-y-4 flex-1 flex flex-col justify-center">
        
        <!-- Pilihan Bahasa (Source & Target) -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-medium mb-1 text-slate-300">Dari (Input):</label>
                <select id="sourceLang" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
                    <option value="id-ID">Indonesia</option>
                    <option value="en-US">English (Inggris)</option>
                    <option value="tr-TR">Türkçe (Turki)</option>
                    <option value="ar-SA">العربية (Arab)</option>
                    <option value="ja-JP">日本語 (Jepang)</option>
                    <option value="ru-RU">Русский (Rusia)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium mb-1 text-slate-300">Ke (Target):</label>
                <select id="targetLang" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
